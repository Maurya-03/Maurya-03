<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="25%" stop-color="#e9d5ff"/>
    <stop offset="60%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="gs" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2"/></filter>
  <style>
    text { font-family: Consolas, 'Courier New', monospace; }
    .spin1 { animation: sp 9s linear infinite; transform-origin: 800.0px 260.0px; }
    .spin2 { animation: sp 15s linear infinite; transform-origin: 800.0px 260.0px; }
    .spin3 { animation: sp 21s linear infinite; transform-origin: 800.0px 260.0px; }
    .spin4 { animation: sp 27s linear infinite; transform-origin: 800.0px 260.0px; }
    @keyframes sp { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:0.8; } 50% { opacity:0.35; } }
  </style>
</defs>
<rect width="1600" height="520" fill="#050510"/>
<circle cx="800.0" cy="260.0" r="140" fill="url(#sun)" opacity="0.5"/>
<circle cx="800.0" cy="260.0" r="22" fill="#f5f3ff" filter="url(#g)"/>
<circle cx="800.0" cy="260.0" r="90" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
<g class="spin1"><circle cx="890.0" cy="260.0" r="14" fill="#a855f7" opacity="0.9" filter="url(#gs)"/></g>
<text x="930.0" y="206.5" text-anchor="start" font-size="13" fill="#a855f7" letter-spacing="2">GITHUB</text>
<circle cx="800.0" cy="260.0" r="150" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
<g class="spin2"><circle cx="950.0" cy="260.0" r="18" fill="#3b82f6" opacity="0.9" filter="url(#gs)"/></g>
<text x="606.0" y="169.5" text-anchor="end" font-size="13" fill="#3b82f6" letter-spacing="2">LINKEDIN</text>
<circle cx="800.0" cy="260.0" r="205" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
<g class="spin3"><circle cx="1005.0" cy="260.0" r="12" fill="#ec4899" opacity="0.9" filter="url(#gs)"/></g>
<text x="1043.0" y="135.25" text-anchor="start" font-size="13" fill="#ec4899" letter-spacing="2">EMAIL</text>
<circle cx="800.0" cy="260.0" r="250" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
<g class="spin4"><circle cx="1050.0" cy="260.0" r="10" fill="#22d3ee" opacity="0.9" filter="url(#gs)"/></g>
<text x="514.0" y="106.5" text-anchor="end" font-size="13" fill="#22d3ee" letter-spacing="2">LOCATION</text>
</svg>