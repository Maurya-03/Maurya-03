<svg width="1600" height="620" viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="68"/>
    </clipPath>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#0a0616"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="gs" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="rc"><rect x="0" y="0" width="1600" height="620" rx="20"/></clipPath>
    <style>
      text { font-family: Consolas, 'Courier New', monospace; }
      .lbl { fill:#7dd3fc; font-size:11px; letter-spacing:2px; opacity:0.85; }
      .val { fill:#f1f5f9; font-size:16px; font-weight:700; letter-spacing:1px; }
      .term { fill:#4ade80; font-size:14px; }
      .scan { animation: scan 4.5s linear infinite; }
      @keyframes scan { 0% { transform: translateY(0); opacity:0;} 8% {opacity:0.7;} 92% {opacity:0.7;} 100% { transform: translateY(560px); opacity:0;} }
      .blink { animation: blink 1.4s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .flicker { animation: flicker 5s infinite; }
      @keyframes flicker { 0%,100% {opacity:1;} 4% {opacity:0.7;} 6% {opacity:1;} 45% {opacity:1;} 46% {opacity:0.6;} 47% {opacity:1;} }
      .spin { animation: spin 6s linear infinite; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .led { animation: led 1.8s ease-in-out infinite; }
      @keyframes led { 0%,100% { opacity:1;} 50% {opacity:0.3;} }
    </style>
  </defs>
  <g clip-path="url(#rc)">
    <rect width="1600" height="620" fill="url(#cardBg)"/>
    <rect x="0.5" y="0.5" width="1599" height="619" rx="20" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity="0.6" filter="url(#g)"/>

    <!-- header bar -->
    <text x="40" y="46" class="term">&gt; IDENTITY_CARD.SYS</text>
    <circle cx="1560" cy="40" r="5" fill="#4ade80" class="led"/>
    <text x="1544" y="45" text-anchor="end" class="lbl" fill="#4ade80">ONLINE</text>
    <line x1="40" y1="62" x2="1560" y2="62" stroke="#4c1d95" stroke-width="1"/>

    <!-- left: avatar frame -->
        <!-- left: avatar frame -->
    <g transform="translate(150,220)">
      <circle r="105" fill="url(#avatarGlow)"/>
      <circle r="98" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#g)"/>
      <circle r="112" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="4 10" class="spin" opacity="0.7"/>
      <image
         href="https://raw.githubusercontent.com/Maurya-03/Maurya-03/main/assets/Github_profile.png"
         x="-68"
         y="-68"
         width="136"
         height="136"
         clip-path="url(#avatarClip)"
         preserveAspectRatio="xMidYMid slice"
      />
    </g>

    <text x="150" y="365" text-anchor="middle" class="val" font-size="20">MAURYA C R</text>
    <text x="150" y="390" text-anchor="middle" class="lbl">FULL STACK DEVELOPER</text>
    <text x="150" y="410" text-anchor="middle" class="lbl" fill="#c084fc">AI ENTHUSIAST · CYBERSECURITY LEARNER</text>

    <line x1="330" y1="90" x2="330" y2="580" stroke="#4c1d95" stroke-width="1"/>

    <!-- stat blocks -->
    <g transform="translate(380,110)">
      <text class="lbl">LOCATION</text>
      <text y="26" class="val" font-size="15">INDIA, EARTH</text>
    </g>
    <g transform="translate(620,110)">
      <text class="lbl">STATUS</text>
      <text y="26" class="val" font-size="15" fill="#4ade80">ALWAYS BUILDING</text>
      <circle cx="140" cy="-5" r="4" fill="#4ade80" class="led"/>
    </g>
    <g transform="translate(380,180)">
      <text class="lbl">EXPERIENCE</text>
      <text y="26" class="val" font-size="15">∞ LEARNING</text>
    </g>
    <g transform="translate(620,180)">
      <text class="lbl">MISSION</text>
      <text y="26" class="val" font-size="15">CODE. SECURE. INNOVATE.</text>
    </g>

    <line x1="330" y1="250" x2="1560" y2="250" stroke="#4c1d95" stroke-width="1" opacity="0.6"/>

    <!-- terminal boot sequence -->
    <g transform="translate(380,285)" class="term">
      <text y="0" class="flicker">$ whoami</text>
      <text y="26" fill="#94a3b8">&gt; CS &amp; Engineering (Cyber Security) student</text>
      <text y="52" fill="#94a3b8">&gt; Full-stack + backend engineering focus</text>
      <text y="78" fill="#94a3b8">&gt; Exploring AI / ML systems</text>
      <text y="104" fill="#94a3b8">&gt; Building secure, scalable software</text>
      <text y="130" fill="#94a3b8">&gt; Currently: system design + advanced backend</text>
      <text y="156" fill="#94a3b8">&gt; Open source contributor</text>
      <text y="190" class="flicker" fill="#4ade80">$ echo $MISSION</text>
      <text y="216" fill="#22d3ee">"Solve real world problems."</text>
      <rect x="0" y="228" width="10" height="16" fill="#4ade80" class="blink"/>
    </g>

    <!-- barcode + id footer section -->

  </g>
  <rect x="0.5" y="0.5" width="1599" height="619" rx="20" fill="none" stroke="#312e81" stroke-width="1"/>
</svg>
